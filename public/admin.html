<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>BrewTech - Адмін-панель</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        h1 { color: #d4af37; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1a1a1a; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #333; font-size: 14px; }
        th { background: #222; color: #d4af37; }
        select { background: #222; color: #fff; border: 1px solid #444; padding: 6px; border-radius: 4px; }
        .back-link { display: inline-block; margin-bottom: 15px; color: #d4af37; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <a href="/" class="back-link">&larr; На головну сторінку</a>
    <h1>Панель керування замовленнями</h1>
    <div id="admin-content">
        <p>Завантаження замовлень...</p>
    </div>

    <script>
        async function fetchOrders() {
            const container = document.getElementById('admin-content');
            try {
                const res = await fetch('/api/v1/orders');
                const data = await res.json();
                const orders = Array.isArray(data) ? data : (data.items || data.data || []);

                if (!orders.length) {
                    container.innerHTML = '<p>Немає активних замовлень.</p>';
                    return;
                }

                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Клієнт</th>
                                <th>Телефон</th>
                                <th>Самовивоз</th>
                                <th>Сума</th>
                                <th>Статус</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                orders.forEach(order => {
                    const id = order._id || order.id || '';
                    html += `
                        <tr>
                            <td>#${id.slice(-6)}</td>
                            <td>${order.customerName || '—'}</td>
                            <td>${order.phone || '—'}</td>
                            <td>${order.pickupTime || '—'}</td>
                            <td style="color: #d4af37; font-weight: bold;">${order.totalPrice || 0} ₴</td>
                            <td>
                                <select onchange="updateStatus('${id}', this.value)">
                                    <option value="Опрацьовується" ${order.status === 'Опрацьовується' ? 'selected' : ''}>Опрацьовується</option>
                                    <option value="Готується" ${order.status === 'Готується' ? 'selected' : ''}>Готується</option>
                                    <option value="Готово" ${order.status === 'Готово' ? 'selected' : ''}>Готово</option>
                                    <option value="Видано" ${order.status === 'Видано' ? 'selected' : ''}>Видано</option>
                                </select>
                            </td>
                        </tr>
                    `;
                });

                html += '</tbody></table>';
                container.innerHTML = html;
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p style="color: #e74c3c;">Помилка завантаження замовлень з сервера.</p>';
            }
        }

        async function updateStatus(id, newStatus) {
            try {
                const res = await fetch(`/api/v1/orders/${id}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                if (!res.ok) {
                    alert('Не вдалося оновити статус');
                }
            } catch (err) {
                console.error(err);
                alert('Помилка мережі при оновленні статусу');
            }
        }

        document.addEventListener('DOMContentLoaded', fetchOrders);
    </script>
</body>
</html>
