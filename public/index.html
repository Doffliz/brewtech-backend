<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>☕ BrewTech | Кав'ярня</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-theme">
    <header class="header">
        <div class="logo">☕ BrewTech</div>
        <div class="header-actions">
            <button id="cart-toggle-btn" class="cart-btn">🛒 Кошик (<span id="cart-count">0</span>)</button>
        </div>
    </header>

    <main class="main-container">
        <section class="menu-section">
            <h2>Наше Меню</h2>
            <div id="menu-container" class="menu-grid"></div>
        </section>
    </main>

   
    <div id="cart-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-cart" class="close">&times;</span>
            <h2>Ваш кошик</h2>
            <div id="cart-items-list"></div>
            <div class="cart-total">Загалом: <span id="cart-total-price">0</span> ₴</div>
            
            <form id="checkout-form" class="checkout-form">
                <input type="text" id="customerName" placeholder="Ім'я клієнта" required>
                <input type="tel" id="phone" placeholder="Номер телефону" required>
                <input type="text" id="pickupTime" placeholder="Час видачі (напр. 14:30)" required>
                <button type="submit" class="submit-btn">Оформити замовлення</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
