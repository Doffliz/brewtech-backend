<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrewTech — Кав'ярня</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="logo">
      <span>☕</span> BrewTech
    </div>
    <nav class="nav-group">
      <button onclick="switchTab('menuTab')" id="btnMenu" class="nav-btn active">Меню</button>
      <button onclick="switchTab('ordersTab')" id="btnOrders" class="nav-btn">Замовлення</button>
    </nav>
  </header>

  <main class="container">
    <div id="loader" class="loader hidden"></div>
    <div id="alertBox" class="alert hidden"></div>

   
    <section id="menuTab" class="tab-content">
      <div class="layout-grid">
        <div>
          <h2 class="section-title">Оберіть напій</h2>
          <div id="menuGrid" class="grid"></div>
        </div>

        <div class="form-card">
          <h2 class="section-title" style="margin-bottom: 1rem;">Замовлення</h2>
          <form id="createOrderForm">
            <div class="form-group">
              <label for="customerName">Ім'я клієнта</label>
              <input type="text" id="customerName" required placeholder="Сергій">
            </div>
            <div class="form-group">
              <label for="customerPhone">Номер телефону</label>
              <input type="tel" id="customerPhone" required placeholder="+380991234567">
            </div>
            <div class="form-group">
              <label for="pickupTime">Час видачі</label>
              <input type="text" id="pickupTime" required placeholder="14:30">
            </div>
            <div class="form-group">
              <label for="selectedItemId">Обрана позиція</label>
              <input type="text" id="selectedItemId" readonly placeholder="Натисніть «Обрати» в меню">
            </div>
            <button type="submit" class="btn-primary">Оформити замовлення</button>
          </form>
        </div>
      </div>
    </section>

   
    <section id="ordersTab" class="tab-content hidden">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 class="section-title">Активні замовлення</h2>
        <button onclick="fetchOrders()" class="btn-secondary">Оновити</button>
      </div>
      <div id="ordersList" class="grid" style="grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
